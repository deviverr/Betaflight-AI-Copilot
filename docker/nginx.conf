# Static host for the Betaflight AI Copilot bundle.
#
# The app is a single-page PWA with no backend: every route falls back to
# index.html, hashed assets are cached hard, and the entry point and service
# worker are never cached so a redeploy is picked up on the next load.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Web Serial only works in a secure context. http://localhost counts as one,
    # so plain HTTP is correct for local use; see COPILOT_TLS for LAN access.

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Hashed filenames, so these can be cached indefinitely.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Never cache the entry point or the service worker: they are how an update
    # reaches an already-installed PWA.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        types { } default_type application/javascript;
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
